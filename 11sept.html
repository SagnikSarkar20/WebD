<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            border-radius: 20%;
        }
        #main{
            height: 500px;
            width: 500px;
            position: relative;
        }
        #child{
            height: 50%;
            background-image: linear-gradient(45deg,rgb(88, 33, 165),rgb(209, 72, 214),rgb(210, 53, 210));
            border-radius: 20%;
            position: absolute;
        }
    </style>
</head>
<body>
    <center>
        <div id="main">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRgJ3u6tPkKa96K1VExVXGcHBTx9EWElQV_M72cljwajA&s=10" alt="">
            <div id="child">
                <img height="100px" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQQAU2ybQg4xQbB7lHcGXiFgmSEZwv2-9qWOeP2yceX4w&s=10" alt="">
                <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit.</p>
            </div>
        </div>
    </center>
</body>
</html>
